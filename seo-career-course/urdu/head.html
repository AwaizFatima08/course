<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>SEO کورس: ٹولز، کلائنٹ تلاش اور پیداواریت</title>
<style>
  @page { size: A4; margin: 18mm 16mm 18mm 16mm; }
  :root { --ink:#1d2433; --muted:#5b6475; --brand:#1f6feb; --brand2:#0b3d91; --soft:#eef4ff; --ok:#1a7f37; --warn:#b54708; --line:#d0d7e2; }
  * { box-sizing: border-box; }
  body { font-family: "Noto Nastaliq Urdu", "Noto Naskh Arabic", "Amiri", sans-serif; color: var(--ink); font-size: 13pt; line-height: 2.05; margin: 0; background: #fff; text-align: right; }
  .en, code, .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; font-family: "Liberation Sans", Arial, sans-serif; font-size: 10.5pt; line-height: 1.5; }
  code { font-family: "Liberation Mono", "DejaVu Sans Mono", monospace; background: #f1f3f7; padding: 0 3pt; border-radius: 2pt; font-size: 9.5pt; }
  h1 { font-size: 30pt; color: var(--brand2); margin: 0 0 6pt; line-height: 1.7; }
  h2 { font-size: 20pt; color: var(--brand2); border-bottom: 2px solid var(--brand); padding-bottom: 4pt; margin: 18pt 0 8pt; line-height: 1.8; }
  h3 { font-size: 15pt; color: var(--ink); margin: 14pt 0 4pt; line-height: 1.9; }
  h4 { font-size: 13pt; color: var(--brand2); margin: 10pt 0 3pt; line-height: 1.9; }
  p { margin: 0 0 7pt; }
  ul, ol { margin: 0 0 8pt 0; padding: 0 0 0 0; padding-right: 22pt; }
  li { margin-bottom: 3pt; }
  .chapter { page-break-before: always; }
  .cover { height: 250mm; display: flex; flex-direction: column; justify-content: center; }
  .cover .sub { font-size: 16pt; color: var(--muted); margin-bottom: 26pt; }
  .cover .band { background: linear-gradient(270deg, var(--brand2), var(--brand)); color: #fff; padding: 22pt 24pt; border-radius: 8pt; }
  .cover .band h1 { color: #fff; font-size: 32pt; }
  .cover .meta { margin-top: 22pt; color: var(--muted); font-size: 12pt; }
  .chapter-title { background: var(--soft); border-right: 6px solid var(--brand); padding: 12pt 14pt; border-radius: 4pt; margin-bottom: 10pt; }
  .chapter-title .num { font-size: 13pt; color: var(--brand); font-weight: bold; }
  .chapter-title h2 { border: none; margin: 2pt 0 0; padding: 0; font-size: 22pt; }
  .objectives { background: #f6f8fb; border: 1px solid var(--line); border-radius: 4pt; padding: 8pt 12pt; margin: 8pt 0 12pt; }
  .objectives strong { color: var(--brand2); }
  .box { border-radius: 4pt; padding: 8pt 12pt; margin: 10pt 0; page-break-inside: avoid; }
  .tip { background: #ecfdf3; border-right: 4px solid var(--ok); }
  .warn { background: #fff7ed; border-right: 4px solid var(--warn); }
  .task { background: #f5f3ff; border-right: 4px solid #6d28d9; }
  .box .label { font-weight: bold; display: block; margin-bottom: 2pt; color: var(--brand2); }
  table { border-collapse: collapse; width: 100%; margin: 6pt 0 12pt; font-size: 11pt; line-height: 1.8; page-break-inside: avoid; direction: rtl; }
  th, td { border: 1px solid var(--line); padding: 5pt 7pt; text-align: right; vertical-align: top; }
  th { background: var(--brand2); color: #fff; font-weight: bold; }
  tr:nth-child(even) td { background: #f7f9fc; }
  figure { margin: 12pt 0; page-break-inside: avoid; text-align: center; }
  figure svg { max-width: 100%; height: auto; direction: ltr; }
  figcaption { font-size: 11pt; color: var(--muted); margin-top: 3pt; line-height: 1.8; }
  h2, h3, h4 { page-break-after: avoid; }
  .toc { page-break-before: always; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc li { border-bottom: 1px dotted var(--line); padding: 4pt 0; font-size: 13pt; }
  .toc .part { font-weight: bold; color: var(--brand2); }
  .checklist li { list-style: none; padding-right: 0; }
  .checklist li:before { content: "\2610  "; color: var(--brand2); direction: ltr; display: inline-block; }
  .small { font-size: 11pt; color: var(--muted); }
</style>
</head>
<body>
